<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoE Studio – Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#f6f7f9;--panel:#fff;--line:#e4e7ec;--line2:#eef0f3;--text:#1d2433;--muted:#667085;--faint:#98a2b3;--accent:#1f5fbf;--accent-soft:#eaf1fb;
 --ok:#147a4b;--ok-soft:#e6f4ec;--bad:#b42318;--bad-soft:#fdecea;--warn:#9a6700;--warn-soft:#fff6e0;--ovr:#7a3db8;--ovr-soft:#f3ecfb}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:13px;color:var(--text);background:var(--bg)}
#app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;min-width:1200px}
aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{font-weight:700;font-size:15px;padding:0 10px 12px;display:flex;gap:8px;align-items:center}.brand i{width:26px;height:26px;border-radius:6px;background:var(--accent);display:inline-block}
.lang{display:inline-flex;margin:0 10px 14px;border:1px solid var(--line);border-radius:6px;overflow:hidden;align-self:flex-start}.lang a{padding:4px 12px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:500}.lang a.active{background:var(--accent);color:#fff}
.nav a{display:block;padding:9px 10px;border-radius:6px;color:var(--text);text-decoration:none;cursor:pointer;margin-bottom:2px}.nav a:hover{background:var(--bg)}.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}.nav a.dis{color:var(--faint)}
.sec{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px}
.side-foot{margin-top:auto;padding:0 10px}.side-foot .sec{padding-left:0}.side-foot .lnk{display:block;padding:4px 0}
main{padding:20px 28px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}.crumb{color:var(--muted);font-size:12px}.crumb a{cursor:pointer;color:var(--accent)}
h1{font-size:20px;margin:4px 0 0;font-weight:600}h2{font-size:14px;margin:0 0 12px;font-weight:600}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer;color:var(--text);white-space:nowrap}.btn:hover{border-color:#c8ced8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.btns{display:flex;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g-3-2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
table{border-collapse:collapse;width:100%}th,td{padding:6px 7px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px;background:#fafbfc;white-space:normal}td:first-child,th:first-child{text-align:left}td.l,th.l{text-align:left}.nowrap{white-space:nowrap}
tr.b td{font-weight:600}tr.sub td{color:var(--muted)}tr.hl td{background:#fafbfc;font-weight:600}tr.grp td{background:#f4f6f9;font-weight:600;color:var(--muted);font-size:12px}tr.off td{color:var(--faint)}
tr.clk{cursor:pointer}tr.clk:hover td{background:#fafbfc}.neg{color:var(--bad)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-grey{background:#f0f2f5;color:var(--muted)}.t-ovr{background:var(--ovr-soft);color:var(--ovr)}.t-acc{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs a{padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs a.active{color:var(--accent);border-color:var(--accent);font-weight:600}
.stabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.stabs a{padding:6px 12px;border:1px solid var(--line);border-radius:16px;cursor:pointer;color:var(--muted);background:#fff;font-size:12px}.stabs a.active{background:var(--accent);border-color:var(--accent);color:#fff}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;min-width:0}.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:22px;font-weight:600;margin:6px 0 4px}
.kpi .s{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:4px}.kpi.bad{border-color:#f3c1bc}.kpi.warn{border-color:#f2dca6}
.kpi .fx{font-size:10.5px;color:var(--faint);margin-top:8px;border-top:1px dashed var(--line2);padding-top:6px;line-height:1.4}
.kstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:14px}
.ks{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}.ks b{font-size:16px;color:var(--text)}.ks .tag{align-self:flex-start}.ks.bad{border-color:#f3c1bc}.ks.warn{border-color:#f2dca6}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.u{color:var(--faint);font-size:11px}
.fi{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;font:inherit;color:var(--text);width:100%}.fi:focus{outline:2px solid #c9dbf4;border-color:var(--accent)}.fi:disabled{background:#f7f8fa;color:var(--muted)}
.fi.num{text-align:right}select.fi{padding:5px 6px}
.fiw{display:inline-flex;align-items:center;position:relative;max-width:100%}.fiw i{position:absolute;right:7px;font-style:normal;color:var(--faint);font-size:11px;pointer-events:none}.fiw input{padding-right:20px}
.f .fiw{display:flex}.f .fiw input{width:100%}
.fi.ovr{background:var(--ovr-soft);border-color:#cdb4ec}.fi.out{background:var(--warn-soft);border-color:#e9c46a}.fi.need{border-color:#e9c46a;background:#fffaf0}
.in.calc{border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:#f7f8fa;color:var(--muted);text-align:right}
.cb{width:15px;height:15px;accent-color:var(--accent)}
.hint{font-size:11px;color:var(--faint);margin-top:6px}.note{font-size:11px;color:var(--faint)}.muted{color:var(--muted)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);align-items:center;flex-wrap:wrap}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.alert{border-radius:6px;padding:10px 12px;font-size:12px;margin-bottom:12px}.alert.w{background:var(--warn-soft);color:#6b4a00;border:1px solid #f2dca6}.alert.i{background:var(--accent-soft);color:#174a94;border:1px solid #c9dbf4}.alert.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bfe3cd}
.scroll{overflow-x:auto}.filters{display:flex;gap:8px;margin-bottom:12px}.filters .fi{width:auto;min-width:150px}
.rng{position:relative;height:6px;background:#eef0f3;border-radius:3px;width:110px;display:inline-block;vertical-align:middle}.rng b{position:absolute;top:0;height:6px;background:#c9dbf4;border-radius:3px}.rng i{position:absolute;top:-3px;width:3px;height:12px;border-radius:1px;background:#1d2433}.rng i.out{background:var(--bad)}
.bar{background:#eef0f3;border-radius:3px;height:8px;width:180px}.bar div{height:8px;border-radius:3px}
.ramp{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;text-align:center}.rb{height:90px;background:#f4f6f9;border-radius:4px;display:flex;align-items:flex-end;margin-bottom:6px}.rb div{width:100%;background:#1f5fbf;border-radius:4px;opacity:.85}
.ramp .fiw input{width:62px}
.addrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.addrow .fi{width:auto}
.ic,.lnk{cursor:pointer;color:var(--accent);text-decoration:none}.ic{color:var(--faint);padding:0 3px}.ic:hover{color:var(--bad)}
td.mx{cursor:pointer}td.mx:hover{background:#f4f6f9}td.mx.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.heat td{text-align:center;font-weight:500}.slider{display:flex;align-items:center;gap:10px;margin:10px 0}.slider input{flex:1}.slider b{width:56px;text-align:right}
.fxcell{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#344054;white-space:normal;text-align:left}
.diff{background:var(--warn-soft)}.ph{border:1px dashed var(--line);border-radius:8px;padding:40px;text-align:center;color:var(--muted);background:#fff}
details summary{cursor:pointer;color:var(--accent);margin-top:10px;font-size:12px}
.exc table td,.exc table th{padding:5px 7px}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.35);display:flex;align-items:center;justify-content:center;z-index:10}.modal{background:#fff;border-radius:10px;padding:20px;width:560px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
</style></head><body><div id="app"></div>

/* ===== BoE calculation engine (port of Excel "Core" sheet, KPI definitions unified) ===== */
function boeEngine(p){
  const DAYS_M=30, DAYS_Y=360, sum=a=>a.reduce((x,y)=>x+y,0);
  const eqP5 = p.eqP5==null?0.5:p.eqP5, closeSave = p.closeSave==null?0.35:p.closeSave;
  // ---- pre-opening split
  const preOpex={Rent:0,LC:0,MKT:0,CMS:0,OCE:0}; let preTotal=0, preCap=0;
  (p.pre||[]).forEach(x=>{const a=+x.amt||0, o=x.opex==null?1:+x.opex; preTotal+=a; preCap+=a*(1-o); preOpex[x.grp]=(preOpex[x.grp]||0)+a*o;});
  const deposit = p.rent*p.depMonths + p.depUtil;
  const capex = p.cons + p.eqland;                       // construction + equipment + landscape
  const totalCash = p.key + capex + preTotal + deposit;  // D32
  const capexInit = capex + preCap;                      // U105 (asset base for depreciation & debt)
  const cmsPct = p.p3*p.comm;
  const revT = p.adtc*p.ac/1000*DAYS_M, lcM = revT*p.lc;
  const depMonthly = p.cons/5/12 + p.eqland*eqP5/5/12 + p.eqland*(1-eqP5)/3/12;
  // ---- monthly (6 ramp-up + 12)
  const M=[];
  for(let i=0;i<18;i++){
    const r=i<6?p.ramp[i]:1, adtc=p.adtc*r, ads=adtc*p.ac/1000, rev=ads*DAYS_M, f=i==0;
    const m={i,r,adtc,ads,tc:adtc*DAYS_M,rev,cogs:rev*p.cogs,rent:p.rent+(f?preOpex.Rent:0),lc:lcM+(f?preOpex.LC:0),
      mkt:rev*p.mkt+(f?preOpex.MKT:0),cms:rev*cmsPct+(f?preOpex.CMS:0),oce:rev*p.oce+(f?preOpex.OCE:0),dep:depMonthly};
    m.gp=m.rev-m.cogs; m.ebitda=m.gp-m.rent-m.lc-m.mkt-m.cms-m.oce; m.noi=m.ebitda-m.dep; M.push(m);
  }
  // ---- yearly P&L
  const Y=[];
  const agg=(a,b)=>{const s=M.slice(a,b),o={};['tc','rev','cogs','rent','lc','mkt','cms','oce'].forEach(k=>o[k]=sum(s.map(x=>x[k])));return o};
  Y[0]=agg(0,6); Y[0].adtc=Y[0].tc/180;
  Y[1]=agg(6,18); Y[1].adtc=Y[1].rev/DAYS_Y/p.ac*1000;
  for(let y=2;y<=10;y++){const pr=Y[y-1],adtc=pr.adtc*(1+p.g[y-1]),rev=adtc*p.ac/1000*DAYS_Y;
    Y[y]={adtc,tc:adtc*DAYS_Y,rev,cogs:rev*p.cogs,rent:pr.rent*(1+p.ri[y-1]),lc:pr.lc*(1+p.w[y-1]),mkt:rev*p.mkt,cms:rev*cmsPct,oce:rev*p.oce};}
  Y.forEach(y=>{y.ads=y.adtc*p.ac/1000; y.gp=y.rev-y.cogs; y.ebitda=y.gp-y.rent-y.lc-y.mkt-y.cms-y.oce;});
  // ---- depreciation
  const straight=(U,life,start,half)=>{const d=Array(11).fill(0);let rem=U;for(let y=start;y<=10&&rem>1e-9;y++){const v=Math.min(rem,U/life*(half&&y==start?0.5:1));d[y]=v;rem-=v;}return d};
  const initAssets=[[p.cons,5],[p.eqland*eqP5,5],[p.eqland*(1-eqP5),3],[preCap,3]];
  const depInit=Array(11).fill(0); initAssets.forEach(([U,l])=>straight(U,l,0,true).forEach((v,i)=>depInit[i]+=v));
  const reinv=Array(11).fill(0); for(let y=1;y<=10;y++) reinv[y]=capex*p.rrr[y-1];
  const depRe=Array(11).fill(0); for(let k=1;k<=10;k++) for(let y=k;y<=Math.min(10,k+4);y++) depRe[y]+=reinv[k]/5;
  // ---- debt (each year's investment financed debt%, repaid over tenor)
  const inv=[capexInit,...reinv.slice(1)], tr=inv.map(v=>v*p.debt), repay=Array(11).fill(0);
  tr.forEach((T,k)=>{let rem=T;for(let y=k;y<=10&&rem>1e-9;y++){const v=Math.min(rem,T/p.tenor*(y==0?0.5:1));repay[y]+=v;rem-=v;}});
  let cb=0; const debt=[];
  for(let y=0;y<=10;y++){const ob=y==0?tr[0]:cb, add=y==0?0:tr[y]; cb=ob+add-repay[y];
    debt.push({ob,add,repay:repay[y],cb,int:(ob+cb)/2*p.rate*(y==0?0.5:1)});}
  // ---- cash flow (with re-investment) & initial-only
  let acc=0, acci=0;
  Y.forEach((o,y)=>{
    o.depInit=depInit[y]; o.depRe=depRe[y]; o.dep=depInit[y]+depRe[y]; o.noi=o.ebitda-o.dep; o.int=debt[y].int;
    o.cit=Math.max(0,o.noi-o.int)*p.cit; o.ni=o.noi-o.int-o.cit;
    o.eff = y>0 && p.rrr[y-1]>0 ? (-o.gp+o.lc*closeSave+o.oce*closeSave)/12*(1-p.cit) : 0;   // 1-month renovation closure
    o.reinv=reinv[y]; o.cfo=o.ni+o.dep+o.eff; o.cfi= y==0?-totalCash:-reinv[y]; o.fcf=o.cfo+o.cfi;
    o.acc = y==0?o.fcf:(acc<0?o.fcf+acc:0); acc=o.acc; o.cum=(y==0?0:Y[y-1].cum)+o.fcf;
    o.noiI=o.ebitda-o.depInit; o.citI=Math.max(0,o.noiI-o.int)*p.cit; o.niI=o.noiI-o.int-o.citI;
    o.fcfI=o.niI+o.depInit+(y==0?-totalCash:0); o.accI= y==0?o.fcfI:(acci<0?o.fcfI+acci:0); acci=o.accI;
    o.debt=debt[y];
  });
  // ---- KPIs
  const irr=cf=>{const npv=r=>cf.reduce((a,v,i)=>a+v/Math.pow(1+r,i),0);let lo=-0.99,hi=10;if(npv(lo)*npv(hi)>0)return null;
    for(let k=0;k<200;k++){const m=(lo+hi)/2;npv(m)>0?lo=m:hi=m;}return (lo+hi)/2};
  const payback=(accs,fcf)=>{let mx=-Infinity,ix=-1;accs.forEach((v,i)=>{if(v>mx){mx=v;ix=i}});if(mx<=0)return null;
    return (ix-1)+(fcf[ix]-mx)/fcf[ix]};   // same convention as Excel D6/D7
  const kpi={
    irr10:irr(Y.map(y=>y.fcf)), irr5:irr(Y.slice(0,6).map(y=>y.fcf)),
    roic: Y[1].ebitda/(capex+p.key+preTotal),            // unified definition (proposed)
    sc: Y[1].rev/capex,                                   // unified definition (proposed)
    pb: payback(Y.map(y=>y.acc),Y.map(y=>y.fcf)), pbi: payback(Y.map(y=>y.accI),Y.map(y=>y.fcfI)),
    roicXL: Y[1].ebitda/(p.key+capex+preTotal-(p.mktFee||0))  // Kon Tum Excel definition, for reconciliation only
  };
  return {M,Y,kpi,cap:{cons:p.cons,eqland:p.eqland,capex,preTotal,preCap,preOpex,deposit,totalCash,capexInit,reinvTotal:sum(reinv)},cmsPct,revT,lcM};
}
if(typeof module!=='undefined') module.exports=boeEngine;

const MISSING=new Set();    // i18n keys without EN (debug)
const t=s=>{ if(LANG=='vi')return s; const e=EN[s]; if(e===undefined){MISSING.add(s);return s} return e; };
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const loc=()=>LANG=='vi'?'vi-VN':'en-US';
const fmt=(v,d=1)=>(v==null||!isFinite(v))?'–':new Intl.NumberFormat(loc(),{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
const pct=(v,d=1)=>(v==null||!isFinite(v))?'–':fmt(v*100,d)+'%';
const raw=(v,d)=>{ if(v==null||v==='')return ''; if(typeof v!='number')return v; let s=String(+v.toFixed(d==null?3:d)); return LANG=='vi'?s.replace('.',','):s; };
const parseNum=s=>{ s=String(s).trim().replace(/\s/g,''); if(s==='')return null;
  if(LANG=='vi'){ s=s.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'); } else { s=s.replace(/,(?=\d{3}(\D|$))/g,''); }

function stdInfo(b,path){ const c=comboOf(b); if(!c) return null; const r=a=>({min:a[0],std:a[1],max:a[2]}); let m;
  if(m=path.match(/^cost\.(\w+)$/)) return r(c.cost[m[1]]);
  if(m=path.match(/^ramp\.(\d)$/)) {const s=c.ramp[+m[1]];return {std:s,min:Math.max(0,s-.15),max:Math.min(1.2,s+.15)};}
  if(m=path.match(/^lt\.(\w+)\.(\d+)$/)) return {std:c.lt[m[1]][+m[2]]};
  if(m=path.match(/^fin\.(\w+)$/)) return c.fin[m[1]]==null?null:{std:c.fin[m[1]]};
  if(m=path.match(/^equip\.(\w+)$/)) return r(c.equip[m[1]]);
  if(m=path.match(/^cons\.(\d+)\.rate$/)) { const it=b.cons[+m[1]]; const a=it&&c.rates[it.k]; return a?r(a):null; }
  if(path=='land.inRate') return r(c.rates.landIn); if(path=='land.outRate') return r(c.rates.landOut); if(path=='land.treeRate') return r(c.rates.tree);
  if(path=='p3'||path=='comm'||path=='pIS') return {std:c.chan[path]};
  return null; }

function rng(min,std,max,val){ if(min==null) return '<span class="note">'+t('báo giá')+'</span>'; const lo=min-(max-min)*.6,hi=max+(max-min)*.6;
  const p=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)); const out=val<min-1e-9||val>max+1e-9;
  return `<span class="rng"><b style="left:${p(min)}%;width:${p(max)-p(min)}%"></b><i style="left:calc(${p(std)}% - 1px);background:#98a2b3"></i><i class="${out?'out':''}" style="left:calc(${p(val)}% - 1px)"></i></span>`; }

/* ---------- computed outputs for the detail screen ---------- */
function outVals(b,R){ const o={}; if(!R) return o; const c=R.cap;
  o.ads=fmt(b.adtc*b.ac/1000,2); o.revM=fmt(R.revT,1); o.p1=pct(1-b.pIS-b.p3,0); o.spend=fmt(b.ac/b.groupSize,1); o.cms=pct(R.cmsPct,2); o.lcM=fmt(R.lcM,1);
  const inv=(+b.inArea||0)+(+b.outArea||0), foh=inv*(1-b.boh)*(1-b.dead), seats=foh/b.sqmPax; o.inv=fmt(inv,1); o.foh=fmt(foh,1); o.seats=fmt(seats,0);
  o.rentSqm=fmt(b.rent*1e6/b.leaseArea,0); o.rentPct=pct(b.rent/R.revT,1);
  const dine=b.adtc*b.pIS; let mx=0;
  b.dayparts.forEach((d,i)=>{const tc=dine*d.pct,g=tc*b.groupSize,s=g/d.turns/b.util; mx=Math.max(mx,s); o['dp'+i+'tc']=fmt(tc,1); o['dp'+i+'g']=fmt(g,1); o['dp'+i+'s']=fmt(s,1);
    o['dp'+i+'bar']=`<div class="bar"><div style="width:${Math.min(100,s/seats*100)}%;background:${s/seats>.85?'#9a6700':'#1f5fbf'}"></div></div>`;});
  o.dpMax=fmt(mx,0)+' / '+fmt(seats,0)+' '+t('ghế')+' → '+(mx<=seats?`<span class="tag t-ok">${t('Đủ ghế')}</span>`:`<span class="tag t-bad">${t('Thiếu ghế')}</span>`);
  let excl=0; b.cons.forEach((it,i)=>{const a=consAmt(b,it); o['c'+i+'q']=fmt(consQty(b,it),1); o['c'+i+'a']=fmt(a,1); if(!it.inc&&a>0)excl+=a;});
  o.consTot=fmt(c.cons,1); o.consExcl=excl;
  const comb=comboOf(b); let eq=0; EQ_GROUPS.forEach(([g])=>{eq+=+b.equip[g]||0;}); o.eqTot=fmt(eq,1);
  const la=landAmt(b); o.lIn=fmt(la.in,1); o.lOut=fmt(la.out,1); o.lTree=fmt(la.tree,1); o.lTot=fmt(la.in+la.out+la.tree,1);
  o.capex=fmt(c.capex,1); o.key=fmt(+b.key||0,1);
  let po=0,pc=0; b.pre.forEach((x,i)=>{o['p'+i+'o']=fmt(x.amt*x.opex,1); o['p'+i+'c']=fmt(x.amt*(1-x.opex),1); po+=x.amt*x.opex; pc+=x.amt*(1-x.opex);});
  o.preTot=fmt(c.preTotal,1); o.preO=fmt(po,1); o.preC=fmt(pc,1); o.dep=fmt(c.deposit,1); o.depRent=fmt(b.rent*b.fin.depMonths,1); o.cash=fmt(c.totalCash,1);
  R.Y.forEach((y,i)=>{ if(i>0) o['ri'+i]=fmt(y.reinv,1); });
  return o; }

function kpiCards(b,R,compact){ const thr=thrOf(b);
  return KPI_DEF.map(d=>{ const v=R?R.kpi[d.k]:null, st=kStat(d.k,v,thr), th=thr&&thr[d.k];
    const tag=st=='na'?`<span class="tag t-grey">${t('Không áp dụng')}</span>`:`<span class="tag ${st=='ok'?'t-ok':st=='warn'?'t-warn':'t-bad'}">${t(st=='ok'?'Đạt':st=='warn'?'Sát ngưỡng':'Không đạt')}</span>`;
    if(compact) return `<div class="ks ${st}"><span>${t(d.n)}</span><b>${showK(v,d.type)}</b>${tag}</div>`;
    return `<div class="kpi ${st=='ok'||st=='na'?'':st}"><div class="l">${t(d.n)}</div><div class="v">${showK(v,d.type)}</div>
      <div class="s"><span>${th&&th.on?t('Ngưỡng')+' '+d.dir+' '+showK(th.v,d.type):''}</span>${tag}</div>

function chart10(R){ const Y=R.Y,W=640,H=260,l=52,r=14,tp=12,bt=34,n=11,bw=(W-l-r)/n;
  const vals=[...Y.map(y=>y.rev),...Y.map(y=>y.acc),...Y.map(y=>y.ebitda),0]; let max=Math.max(...vals),min=Math.min(...vals);
  const raw5=(max-min)/5,mag=Math.pow(10,Math.floor(Math.log10(Math.max(1,raw5)))),nrm=raw5/mag,step=(nrm<=1?1:nrm<=2?2:nrm<=5?5:10)*mag; max=Math.ceil(max/step)*step; min=Math.floor(min/step)*step;
  const y=v=>tp+(max-v)/(max-min)*(H-tp-bt); let h='';
  for(let g=min;g<=max+1e-9;g+=step) h+=`<line x1="${l}" x2="${W-r}" y1="${y(g)}" y2="${y(g)}" stroke="${Math.abs(g)<1e-9?'#c8ced8':'#eef0f3'}"/><text x="${l-6}" y="${y(g)+4}" font-size="10" fill="#98a2b3" text-anchor="end">${fmt(g/1000,0)}k</text>`;
  Y.forEach((o,i)=>{const x=l+i*bw+bw*.15;h+=`<rect x="${x}" y="${Math.min(y(o.rev),y(0))}" width="${bw*.35}" height="${Math.abs(y(0)-y(o.rev))}" fill="#c9dbf4" rx="2"/><rect x="${x+bw*.35}" y="${Math.min(y(o.ebitda),y(0))}" width="${bw*.35}" height="${Math.abs(y(0)-y(o.ebitda))}" fill="#1f5fbf" rx="2"/><text x="${l+i*bw+bw/2}" y="${H-12}" font-size="10" fill="#667085" text-anchor="middle">Y${i}</text>`});
  const cum=[];Y.reduce((a,o)=>{a+=o.fcf;cum.push(a);return a},0);
  h+=`<polyline points="${cum.map((v,i)=>`${l+i*bw+bw/2},${y(v)}`).join(' ')}" fill="none" stroke="#147a4b" stroke-width="2"/>`+cum.map((v,i)=>`<circle cx="${l+i*bw+bw/2}" cy="${y(v)}" r="3" fill="#fff" stroke="#147a4b" stroke-width="2"/>`).join('');
  if(R.kpi.pb!=null){const px=l+(R.kpi.pb+1.5)*bw-bw;h+=`<line x1="${l+(R.kpi.pb+1)*bw}" x2="${l+(R.kpi.pb+1)*bw}" y1="${tp}" y2="${H-bt}" stroke="#147a4b" stroke-dasharray="3 3"/><text x="${l+(R.kpi.pb+1)*bw+4}" y="${tp+10}" font-size="10" fill="#147a4b">${t('Hoàn vốn')} ${fmt(R.kpi.pb,2)} ${t('năm')}</text>`;}
  return `<svg width="100%" viewBox="0 0 ${W} ${H}">${h}</svg>`; }
function donut(R){ const c=R.cap, parts=[['Xây dựng',c.cons,'#1f5fbf'],['Thiết bị & cảnh quan',c.eqland,'#6f9be0'],['Pre-opening',c.preTotal,'#b8cdee'],['Đặt cọc',c.deposit,'#dfe7f3']];

  const tot=parts.reduce((a,p)=>a+Math.max(0,p[1]),0)||1; let a0=-Math.PI/2,h='';const cx=150,cy=90,r=75,ri=50;

  $('#sDesc').innerHTML=`ADTC ${fmt(b.adtc*(1+a),0)} · AC ${fmt(b.ac*(1+bb),1)}k → ADS ${fmt(b.adtc*(1+a)*b.ac*(1+bb)/1000,2)} ${t('tr/ngày')} · ${t('DT năm 1')} ${fmt(r&&r.Y[1].rev,0)} ${t('tr')}`;
  $('#sK').innerHTML=kpiCards(b,r).replace(/<div class="fx">[\s\S]*?<\/div><\/div>/g,'</div>');

function excPanel(b){ const paths=[]; const add=p=>{const s=fieldStat(b,p); if(s=='out'||s=='ovr') paths.push([p,s]);};
  ['cost.cogs','cost.lc','cost.mkt','cost.oce','pIS','p3','comm','land.inRate','land.outRate','land.treeRate'].forEach(add); b.ramp.forEach((_,i)=>add('ramp.'+i));
  EQ_GROUPS.forEach(([g])=>add('equip.'+g)); b.cons.forEach((_,i)=>add('cons.'+i+'.rate')); ['g','ri','w','rrr'].forEach(k=>b.lt[k].forEach((_,i)=>add('lt.'+k+'.'+i))); Object.keys(b.fin).forEach(k=>add('fin.'+k));
  if(!paths.length) return `<div class="alert ok">✓ ${t('Tất cả giá trị đang theo chuẩn của Bảng tham chiếu.')}</div>`;
  const out=paths.filter(x=>x[1]=='out'), ovr=paths.filter(x=>x[1]=='ovr'), L=b.status=='locked';
  const f=(p)=>{const s=stdInfo(b,p),v=getP(b,p),pp=isPctPath(p),g=x=>pp?pct(x,2):fmt(x,2);return [g(v),g(s.std),s.min!=null?g(s.min)+' – '+g(s.max):'–']};
  return `<div class="card exc"><h2>${t('Khác chuẩn')} <span class="tag t-warn">${out.length} ${t('ngoài khoảng')}</span> <span class="tag t-ovr">${ovr.length} ${t('ghi đè trong khoảng')}</span></h2>
   <table><thead><tr><th>${t('Trường')}</th><th>${t('Store')}</th><th>${t('Chuẩn')}</th><th>${t('Khoảng')}</th><th class="l">${t('Lý do (bắt buộc nếu ngoài khoảng)')}</th><th></th></tr></thead><tbody>
   ${[...out,...ovr].map(([p,s])=>{const [v,sd,rg]=f(p);const need=s=='out'&&!(b.reasons||{})[p];return `<tr><td class="l">${esc(fieldLabel(b,p))} ${s=='out'?`<span class="tag t-warn">${t('Ngoài khoảng')}</span>`:''}</td><td><b>${v}</b></td><td>${sd}</td><td>${rg}</td>
     <td class="l"><input class="fi ${need?'need':''}" style="width:100%" data-reason="${p}" value="${esc((b.reasons||{})[p]||'')}" placeholder="${s=='out'?t('Nhập lý do…'):t('Không bắt buộc')}" ${L?'disabled':''}></td>

  <div class="note">${t('Mã tài khoản trong bảng chỉ là minh họa.')}</div>`; }
function scrActual(){ return `<div class="top"><div><div class="crumb">Phase 2</div><h1>${t('Đối chiếu thực tế vs BoE')}</h1></div></div><div class="ph">
  <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px">${t('Phase 2 – chưa làm trong bản này')}</div>${t('Store mở trong 24 tháng gần nhất · KPI theo tháng: ADTC, AC, ADS (POS) · Revenue, %COGS, %LC, Rent, EBITDA, NOI (Netsuite) · CAPEX thực chi · Ngày khai trương thực tế')}</div>`; }

/* ============ BoE Studio prototype — events & actions ============ */
function dl(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500); }
const csvRow=a=>a.map(x=>{x=x==null?'':typeof x=='number'?String(+x.toFixed(4)):String(x);return /[",\n;]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(',');
function exportCsv(b){ const r=calc(b); if(!r) return; const L=[];
  L.push(csvRow(['BoE',b.code+' '+b.name])); L.push(csvRow(['Format × Region',b.format+' × '+b.region])); L.push('');
  L.push(csvRow(['KPI','Value'])); KPI_DEF.forEach(k=>L.push(csvRow([k.n,r.kpi[k.k]]))); L.push('');
  L.push(csvRow(['Cash required','',r.cap.totalCash])); L.push(csvRow(['CAPEX','',r.cap.capex])); L.push('');
  const keys=['adtc','rev','cogs','gp','rent','lc','mkt','cms','oce','ebitda','dep','noi','int','cit','ni','eff','cfo','cfi','fcf','acc'];
  L.push(csvRow(['Yearly (M VND)',...r.Y.map((_,i)=>'Y'+i)])); keys.forEach(k=>L.push(csvRow([k,...r.Y.map(y=>y[k])]))); L.push('');
  L.push(csvRow(['Monthly (M VND)',...r.M.map((_,i)=>i<6?'M'+(i+1):'Y1-M'+(i-5))])); ['adtc','ads','rev','cogs','rent','lc','mkt','cms','oce','ebitda','dep','noi'].forEach(k=>L.push(csvRow([k,...r.M.map(m=>m[k])])));
  dl(`BoE_${b.code}_v${b.ver}.csv`,L.join('\n'),'text/csv'); }
function exportList(){ const L=[csvRow(['Code','Name','Format','Region','Status','Version','Opening','Total cash','CAPEX',...KPI_DEF.map(k=>k.n)])];
  S.boes.forEach(b=>{const r=calc(b);L.push(csvRow([b.code,b.name,b.format,b.region,b.status,b.ver,b.opening,r&&r.cap.totalCash,r&&r.cap.capex,...KPI_DEF.map(k=>r&&r.kpi[k.k])]))});
  dl('BoE_list.csv',L.join('\n'),'text/csv'); }

document.addEventListener('click',e=>{ const el=e.target.closest('[data-nav],[data-lang],[data-tab],[data-ptab],[data-open],[data-act],[data-combo]'); if(!el) return; const b=cur();
  if(el.dataset.nav){ S.ui.screen=el.dataset.nav; if(S.ui.screen=='actual') return; render(); window.scrollTo(0,0); return; }
  if(el.dataset.lang){ LANG=el.dataset.lang; render(); return; }
  if(el.dataset.tab){ S.ui.tab=el.dataset.tab; render(); return; }
  if(el.dataset.ptab){ S.ui.ptab=el.dataset.ptab; render(); return; }
  if(el.dataset.combo){ S.ui.combo=el.dataset.combo; render(); return; }
  if(el.dataset.open&&!e.target.closest('[data-act]')){ S.ui.cur=el.dataset.open; S.ui.screen='detail'; S.ui.cmp=null; render(); window.scrollTo(0,0); return; }
  const a=el.dataset.act;
  if(a=='new'){ S.ui.modal='new'; S.ui.nb=null; render(); }
  else if(a=='cancelNew'){ S.ui.modal=null; render(); }
  else if(a=='createNew'){ const nb=createBoE(S.ui.nb); S.ui.modal=null; S.ui.cur=nb.id; S.ui.screen='detail'; S.ui.tab='in'; render(); }
  else if(a=='dup'){ const src=S.boes.find(x=>x.id==el.dataset.id), c=clone(src); Object.assign(c,{id:uid(),code:src.code+'-copy',status:'draft',ver:1,versions:[]}); delete c.snapshot; S.boes.unshift(c); S.ui.cur=c.id; S.ui.screen='detail'; render(); }
  else if(a=='del'){ const x=S.boes.find(y=>y.id==el.dataset.id); if(confirm(t('Xóa BoE')+' '+x.code+' '+x.name+'?')){ S.boes=S.boes.filter(y=>y!==x); render(); } }
  else if(a=='lock'){ const c=comboOf(b); if(!c){alert(t('Chưa có bảng tham chiếu cho tổ hợp này'));return;}
    const miss=excMissing(b); if(miss.length){ alert(t('Cần nhập lý do cho các trường ngoài khoảng trước khi chốt')+':\n• '+miss.map(p=>fieldLabel(b,p)).join('\n• ')); S.ui.tab='in'; render(); return; }
    b.versions.push({v:b.ver,ts:today(),note:'Chốt BoE',by:'Finance',data:(()=>{const d=clone(b);delete d.versions;return d})()});
    b.status='locked'; b.snapshot={combo:comboKey(b),ver:c.ver,eff:c.eff,thr:clone(c.thr),lockedAt:today()}; render(); }
  else if(a=='unlock'){ if(confirm(t('Mở khóa BoE để sửa? Ngưỡng KPI sẽ quay về theo Bảng tham chiếu hiện hành.'))){ b.status='draft'; delete b.snapshot; b.ver++; render(); } }
  else if(a=='csv') exportCsv(b);
  else if(a=='exportList') exportList();
  else if(a=='addCons'){ const k=$('#addCons').value, c=comboOf(b), cat=catOf(k); b.cons.push({k,qty:1,rate:c&&c.rates[k]?c.rates[k][1]:0,inc:1}); render(); }
  else if(a=='delCons'){ b.cons.splice(+el.dataset.i,1); render(); }
  else if(a=='addPre'){ b.pre.push({name:t('Khoản mục mới'),grp:'OCE',amt:0,opex:1}); render(); }
  else if(a=='delPre'){ b.pre.splice(+el.dataset.i,1); render(); }
  else if(a=='resetStd'){ const p=el.dataset.p, s=stdInfo(b,p); if(s){ setP(b,p,s.std); delete b.reasons[p]; render(); } }
  else if(a=='saveVer'){ const d=clone(b); delete d.versions; b.versions.push({v:b.ver,ts:today(),note:$('#verNote').value||t('Lưu phiên bản'),by:'Finance',data:d}); b.ver++; S.ui.cmp=null; render(); }
  else if(a=='restore'){ const v=b.versions.find(x=>x.v==+el.dataset.v); if(v&&confirm(t('Khôi phục dữ liệu của')+' v'+v.v+'?')){ const keep={id:b.id,versions:b.versions,ver:b.ver}; Object.keys(b).forEach(k=>delete b[k]); Object.assign(b,clone(v.data),keep); render(); } }
  else if(a=='applySens'){ const s=S.ui.sens; if(!s.a&&!s.b) return; if(confirm(t('Áp dụng ADTC / AC của kịch bản vào BoE?'))){ b.adtc=+(b.adtc*(1+s.a/100)).toFixed(2); b.ac=+(b.ac*(1+s.b/100)).toFixed(2); S.ui.sens={a:0,b:0}; render(); } }
  else if(a=='newVer'){ const c=S.master.combos[S.ui.combo]; c.ver++; c.eff=today(); render(); }
  else if(a=='mkCombo'){ const [f,r]=S.ui.combo.split('|'); const src=Object.keys(S.master.combos).find(k=>k.startsWith(f+'|'))||'Core|Tây Nguyên'; const c=clone(S.master.combos[src]); c.ver=1; c.eff=today(); S.master.combos[S.ui.combo]=c; render(); }
  else if(a=='addFmt'){ const v=$('#newFmt').value.trim(); if(v&&!S.master.formats.includes(v)){S.master.formats.push(v);render();} }
  else if(a=='addReg'){ const v=$('#newReg').value.trim(); if(v&&!S.master.regions.includes(v)){S.master.regions.push(v);render();} }
  else if(a=='export'){ dl('BoE_Studio_data_'+today()+'.json',JSON.stringify(S,null,1),'application/json'); }
  else if(a=='import'){ $('#fileIn').click(); }
  else if(a=='reset'){ if(confirm(t('Xóa toàn bộ dữ liệu đang có và nạp lại dữ liệu mẫu (Kon Tum, Dĩ An)?'))){ S=seed(); render(); } }
});
function excMissing(b){ const out=[]; const chk=p=>{ if(fieldStat(b,p)=='out'&&!(b.reasons||{})[p]) out.push(p); };
  ['cost.cogs','cost.lc','cost.mkt','cost.oce','land.inRate','land.outRate','land.treeRate'].forEach(chk); b.ramp.forEach((_,i)=>chk('ramp.'+i)); EQ_GROUPS.forEach(([g])=>chk('equip.'+g)); b.cons.forEach((_,i)=>chk('cons.'+i+'.rate')); return out; }

document.addEventListener('change',e=>{ const el=e.target;
  if(el.id=='fileIn'){ const f=el.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.master||!d.boes) throw 0; S=d; render(); }catch(x){ alert(t('File không hợp lệ.')); } }; rd.readAsText(f); return; }
  if(el.dataset.nb!=null){ S.ui.nb[el.dataset.nb]=el.value; render(); return; }
  if(el.dataset.flt!=null){ S.ui.filter=S.ui.filter||{}; S.ui.filter[el.dataset.flt]=el.value; render(); const q=$('[data-flt=q]'); if(el.dataset.flt=='q'&&q){q.focus();} return; }
  if(el.dataset.cmp){ S.ui.cmp[el.dataset.cmp]=+el.value; render(); return; }
  if(el.dataset.reason!=null){ const b=cur(); b.reasons=b.reasons||{}; if(el.value.trim()) b.reasons[el.dataset.reason]=el.value.trim(); else delete b.reasons[el.dataset.reason]; save(); el.classList.toggle('need',fieldStat(b,el.dataset.reason)=='out'&&!el.value.trim()); return; }
  if(!el.dataset.b) return;
  const tgt=el.dataset.m?S.master.combos[S.ui.combo]:cur(), k=el.dataset.k, p=el.dataset.b; let v;
  if(k=='chk') v=el.checked?1:0; else if(k=='t'||k=='d'||k=='sel') v=el.value;
  else { v=parseNum(el.value); if(v==null){ el.value=raw(k=='p'?getP(tgt,p)*100:getP(tgt,p)); return; } if(k=='p') v=v/100; }
  setP(tgt,p,v);
  if(el.dataset.re||el.dataset.m||/^(inArea|outArea)$/.test(p)&&S.ui.tab=='capex'){ render(); return; }
  if(k!='t'&&k!='d'&&k!='sel'){ el.value=k=='p'?raw(v*100,2):raw(v); }
  refresh(); save(); });
document.addEventListener('input',e=>{ const el=e.target; if(el.id=='sA'||el.id=='sB'){ S.ui.sens[el.id=='sA'?'a':'b']=+el.value; updSens(); } });
document.addEventListener('keydown',e=>{ if(e.key=='Enter'&&e.target.matches('input.fi')) e.target.blur(); });

S=load()||seed(); render();

</script></body></html>
